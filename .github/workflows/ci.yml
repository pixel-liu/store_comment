name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and start demo
        run: docker compose -f compose.demo.yml up --build -d --wait --wait-timeout 180
      - name: Verify demo accounts and reservation flow
        run: node demo/smoke-test.cjs
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.demo.yml logs --no-color
      - name: Stop demo
        if: always()
        run: docker compose -f compose.demo.yml down -v
