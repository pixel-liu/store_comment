<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#153a2b">
    <title>食堂运营后台 · 校园取餐</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/campus.css?v=9">
    <link rel="stylesheet" href="/backoffice.css?v=4">
    <script src="/campus-common.js?v=3" defer></script>
    <script src="/backoffice.js?v=5" defer></script>
</head>
<body class="backoffice">
<a class="skip-link" href="#main">跳到内容</a>
<header class="site-header">
    <div class="shell header-inner">
        <a class="brand" href="/backoffice.html"><img src="/favicon.svg" alt="" width="34" height="34">校园取餐</a>
        <a class="student-link" href="/">进入学生端</a>
        <button type="button" class="account-button" id="accountButton">登录</button>
    </div>
</header>
<main class="shell" id="main" tabindex="-1">
    <div class="backoffice-heading">
        <h1>食堂运营后台</h1>
        <p id="backofficeRole" hidden></p>
    </div>
    <div id="accessNotice" aria-live="polite"></div>
    <div class="backoffice-workspace" id="backofficeWorkspace" hidden>
        <nav class="navigation backoffice-navigation" aria-label="后台功能">
            <a href="#workbench" id="staffLink" hidden>食堂工作台</a>
            <a href="#windows" id="adminLink" hidden>窗口与人员</a>
        </nav>
        <section id="staffPanel" aria-labelledby="staffTitle" hidden>
            <div class="page-heading">
                <h2 id="staffTitle">食堂工作台</h2>
                <label class="window-select">
                    当前窗口
                    <select id="mealShop"></select>
                </label>
            </div>
            <div class="operations-nav reservation-filters" role="group" aria-label="窗口运营功能">
                <button type="button" class="secondary-button" id="workbenchTab" aria-pressed="true">批次与核销</button>
                <button type="button" class="secondary-button" id="statsTab" aria-pressed="false">运营看板</button>
            </div>
            <section class="operations-report" id="operationsReport" aria-labelledby="statsTitle" hidden>
                <form id="mealStatsForm" class="report-toolbar">
                    <h3 id="statsTitle">窗口取餐统计</h3>
                    <div class="report-dates">
                        <label>开始日期<input name="from" type="date"></label>
                        <label>结束日期<input name="to" type="date"></label>
                        <button type="submit" class="secondary-button">查询</button>
                    </div>
                </form>
                <div id="mealStats" aria-live="polite"></div>
            </section>
            <div class="staff-workspace" id="staffWorkbench">
                <div class="staff-actions">
                    <form id="redeemMeal" class="staff-form" autocomplete="off">
                        <h3>核销取餐</h3>
                        <div class="form-row">
                            <label>预约号<input name="orderId" inputmode="numeric" pattern="[0-9]{1,19}" maxlength="19" spellcheck="false" required></label>
                            <label>取餐码<input name="pickupCode" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" spellcheck="false" required></label>
                        </div>
                        <div class="form-actions"><button type="submit">确认取餐</button><p class="feedback" role="status"></p></div>
                    </form>
                    <details class="publish-panel">
                        <summary>发布余量餐</summary>
                        <form id="publishMeal" class="staff-form" autocomplete="off">
                            <div class="form-row">
                                <label>餐品名称<input name="title" required maxlength="80" placeholder="例如：鸡腿饭…"></label>
                                <label>可预约份数<input name="stock" type="number" min="1" max="2147483647" required></label>
                            </div>
                            <fieldset>
                                <legend>预约时段</legend>
                                <div class="form-row">
                                    <label>开始<input name="beginTime" type="datetime-local" required></label>
                                    <label>截止<input name="endTime" type="datetime-local" required></label>
                                </div>
                            </fieldset>
                            <fieldset>
                                <legend>取餐时段</legend>
                                <div class="form-row">
                                    <label>开始<input name="pickupBeginTime" type="datetime-local" required></label>
                                    <label>截止<input name="pickupEndTime" type="datetime-local" required></label>
                                </div>
                            </fieldset>
                            <div class="form-actions"><button type="submit">发布批次</button><p class="feedback" role="status"></p></div>
                        </form>
                    </details>
                </div>
                <section class="staff-progress" aria-labelledby="staffBatchesTitle">
                    <div class="section-heading">
                        <h3 id="staffBatchesTitle">窗口批次</h3>
                        <button class="secondary-button" type="button" id="refreshStaff">刷新进度</button>
                    </div>
                    <div id="staffBatches" aria-live="polite"></div>
                    <nav class="page-controls" id="batchPages" aria-label="批次分页" hidden>
                        <button type="button" class="secondary-button" data-batch-page="-1">上一页</button>
                        <span></span>
                        <button type="button" class="secondary-button" data-batch-page="1">下一页</button>
                    </nav>
                </section>
            </div>
        </section>
        <section id="adminPanel" aria-labelledby="windowsTitle" hidden>
            <div class="page-heading">
                <h2 id="windowsTitle">窗口与人员</h2>
            </div>
            <div class="window-management">
                <section class="management-panel" aria-labelledby="staffManagementTitle">
                    <h3 id="staffManagementTitle">窗口人员</h3>
                    <div id="windowsNotice" aria-live="polite"></div>
                    <div id="windowStaff" hidden>
                        <label class="window-select">选择窗口
                            <select id="managedWindow"></select>
                        </label>
                        <p class="window-address" id="windowAddress"></p>
                        <div id="staffList" aria-live="polite"></div>
                        <form id="bindStaff" class="management-form">
                            <label>窗口人员的注册手机号
                                <input name="phone" type="tel" inputmode="numeric" pattern="1[3-9][0-9]{9}"
                                       maxlength="11" autocomplete="off" required>
                            </label>
                            <div class="form-actions">
                                <button type="submit">绑定人员</button>
                                <p class="feedback" id="staffFeedback" role="status"></p>
                            </div>
                        </form>
                    </div>
                </section>
                <form id="createWindow" class="management-panel management-form">
                    <h3>新增窗口</h3>
                    <label>窗口名称
                        <input name="name" maxlength="128" placeholder="例如：一食堂二楼 3 号窗口" required>
                    </label>
                    <label>取餐地址
                        <input name="address" maxlength="255" placeholder="例如：一食堂二楼东侧" required>
                    </label>
                    <div class="form-actions">
                        <button type="submit">新增窗口</button>
                        <p class="feedback" role="status"></p>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>

<dialog id="batchDialog" aria-labelledby="batchDetailTitle">
    <div class="section-heading">
        <h2 id="batchDetailTitle">批次详情</h2>
        <form method="dialog"><button type="submit" class="secondary-button" autofocus>关闭详情</button></form>
    </div>
    <div id="batchDetail" aria-live="polite"></div>
    <p class="feedback" id="closeFeedback" role="status"></p>
    <section class="redemption-log" aria-labelledby="redemptionTitle">
        <h3 id="redemptionTitle">核销记录</h3>
        <div id="redemptionLog" aria-live="polite"></div>
        <nav class="page-controls" id="redemptionPages" aria-label="核销记录分页" hidden>
            <button type="button" class="secondary-button" data-redemption-page="-1">上一页</button>
            <span></span>
            <button type="button" class="secondary-button" data-redemption-page="1">下一页</button>
        </nav>
    </section>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
