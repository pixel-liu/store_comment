server:
  port: 8081
  tomcat:
    threads:
      max: 500        # Tomcat 最大线程数（默认200，高并发下会排队）
      min-spare: 50
    accept-count: 800 # TCP accept 队列深度
spring:
  application:
    name: foodiego
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/foodiego?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 50
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rabbitmq}
    password: ${RABBITMQ_PASSWORD:rabbitmq}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认模式
        prefetch: 50             # 增大预取数，减少网络往返
        concurrency: 8            # 消费者并发数
        max-concurrency: 16       # 最大并发数
    publisher-confirm-type: correlated  # 发布者确认类型
    channel-rpc-timeout: 5000     # 通道RPC超时
    cache:
      channel:
        size: 50                  # 增大通道缓存数

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    lettuce:
      pool:
        enabled: true          # 显式开启连接池（必加，否则 pool 配置被忽略）
        max-active: 200
        max-idle: 100
        min-idle: 20
        time-between-eviction-runs: 10s
      shutdown-timeout: 100ms
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.foodiego.entity # alias scanning package
logging:
  level:
    com.foodiego: info      # reduce log IO under high concurrency, DEBUG disabled
    root: warn

management: # 健康点检测
  endpoints:
    web:
      exposure:
        include: health,info,metrics # 暴露健康点、应用信息、指标 http://localhost:8081/actuator/health
info:
  app:
    name: foodiego
    version: 1.0.0
    description: FoodieGo - Local Food Review &amp; Flash Deal Platform

foodiego:
  security:
    admin-user-ids: ${FOODIEGO_ADMIN_USER_IDS:}
  seckill:
    zone-id: ${FOODIEGO_SECKILL_ZONE_ID:Asia/Shanghai}
  upload-dir: ${FOODIEGO_UPLOAD_DIR:./uploads}
